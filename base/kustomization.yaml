apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - app-deployment.yaml
  - app-service.yaml
  - ingress.yaml

# The ApplicationSet overrides newTag per-PR with the PR's head SHA (see applicationset.yaml).
# `name: tess-preview-app` is the logical name matched in app-deployment.yaml.
images:
  - name: tess-preview-app
    newName: ghcr.io/harshita3199/tess-preview-app
    newTag: latest
