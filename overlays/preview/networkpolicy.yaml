# Blast-radius guardrail: default-deny, then allow only what a preview legitimately needs.
# (Image pulls are done by the kubelet, not the pod, so they are not governed here.)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Only the ingress controller may reach preview pods.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
  egress:
    # DNS resolution.
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Intra-namespace traffic (app ↔ its own ephemeral services, when added).
    - to:
        - podSelector: {}
